name: CI

on:
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "SK"
      ALLOWED_HOSTS: "*"
      DEBUG: "true"
      DJANGO_SETTINGS_MODULE: "nexus_conversations.settings"
      DEFAULT_DATABASE: postgres://nexus:nexus@localhost:5432/nexus
      CELERY_BROKER_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/1
      USE_SQLITE_FOR_TESTS: "false"

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432

        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2
        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade build tools
        run: pip install --upgrade pip setuptools wheel

      - name: Install Poetry
        run: pip install "poetry==1.7.1"

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          poetry config virtualenvs.create false --local
          poetry install --with dev

      - name: Run pre-commit
        run: SKIP=docker-compose-check pre-commit run --all-files

      - name: Run tests with Coverage
        run: poetry run pytest -v --cov --cov-report=term-missing --no-cov-on-fail

      - name: Coverage Report
        run: poetry run coverage report
